[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kyc-document-intelligence"
version = "0.1.0"
description = "KYC document text extraction and review backend"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<0.120",
    "starlette>=0.40,<0.49",
    "anyio>=4,<4.11",
    "uvicorn",
    "pydantic-settings",
    "python-multipart",
    "pymupdf",
    "python-docx>=1.1,<2",
    "Pillow>=10.4,<13",
    "numpy>=1.26,<3",
    "firebase-admin",
    "pytest",
    "pytest-asyncio",
    "httpx>=0.27,<0.29",
    "ruff",
    "black",
]

[project.optional-dependencies]
ocr = [
    "paddlepaddle",
    "paddleocr",
    "pytesseract",
    "opencv-contrib-python==4.10.0.84",
    "numpy>=1.26,<3",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
markers = [
    "emulator: integration tests that require Firebase emulators",
    "slow: integration tests that require real OCR engine runtimes/models",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 88
target-version = ["py311"]